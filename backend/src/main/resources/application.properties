spring.application.name=kamus-bugis

# ── Fuseki SPARQL Endpoint ────────────────────────────────────────────────────
# Override via environment variable FUSEKI_URL dan FUSEKI_DATASET
fuseki.url=${FUSEKI_URL:http://localhost:3030}
fuseki.dataset=${FUSEKI_DATASET:bugis}
fuseki.sparql.endpoint=${fuseki.url}/${fuseki.dataset}/sparql

# ── Groq AI (RAG - Tanya AI) ──────────────────────────────────────────────────
# API key HARUS disediakan via environment variable GROQ_API_KEY
# Dapatkan gratis di https://console.groq.com/keys
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1
groq.model=llama-3.3-70b-versatile
